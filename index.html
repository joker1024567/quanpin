<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全拼只学三件事</title>
<style>
  body{margin:0;font:16px/1.7 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#222;background:#fafaf8;padding:40px 20px}
  .wrap{max-width:640px;margin:0 auto}
  h1{font-size:26px;margin:0 0 24px;text-align:center}
  h2{font-size:18px;margin:32px 0 12px;border-bottom:2px solid #222;padding-bottom:4px}
  .card{background:#fff;border:1px solid #e5e5e0;border-radius:8px;padding:20px;margin:16px 0}
  kbd{display:inline-block;font-family:ui-monospace,monospace;background:#fff;border:1px solid #bbb;border-bottom-width:3px;border-radius:5px;padding:3px 10px;font-size:14px;margin:0 2px}
  code{font-family:ui-monospace,monospace;background:#f0f0eb;padding:2px 6px;border-radius:4px}
  table{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}
  td{padding:8px;border-bottom:1px solid #eee;vertical-align:top}
  td:first-child{font-family:ui-monospace,monospace;color:#555;white-space:nowrap;width:40%}
  .mut{color:#888;font-size:14px}
</style>
</head>
<body>
<div class="wrap">

<h1>全拼只学三件事</h1>
<p class="mut">全拼输入只要会这三件事。</p>

<h2>一、V 键 = ü</h2>
<div class="card">
<p>键盘上没有 ü 这个键。用 <kbd>V</kbd> 输入。</p>
<table>
<tr><td><code>nv</code></td><td>女 nǚ</td></tr>
<tr><td><code>lv</code></td><td>绿 lǜ</td></tr>
<tr><td><code>ve</code></td><td>月 yuè（j/q/x + u 系统自动补 ü 点，不用 V）</td></tr>
</table>
<p class="mut">只有 <code>n</code> 和 <code>l</code> 后面的 ü 必须打 V，其它按系统默认。</p>
</div>

<h2>二、隔音符 <kbd>'</kbd></h2>
<div class="card">
<p>两个音节连着打时，用撇号 <kbd>'</kbd> 切开。</p>
<table>
<tr><td><code>xi'an</code></td><td>西安（不打 → "线"）</td></tr>
<tr><td><code>kuai'er</code></td><td>快儿</td></tr>
<tr><td><code>dong'ao</code></td><td>东奥</td></tr>
</table>
</div>

<h2>三、选字键</h2>
<div class="card">
<p>候选字出现后，三种方式选字。</p>
<table>
<tr><td><kbd>←</kbd> <kbd>→</kbd></td><td>方向键换字（在候选间左右切换）</td></tr>
<tr><td><kbd>1</kbd>–<kbd>9</kbd></td><td>数字键上字（直接选第 N 个候选）</td></tr>
<tr><td><kbd>Space</kbd></td><td>空格上字（默认选第一候选）</td></tr>
</table>
</div>

</div>
</body>
</html>
